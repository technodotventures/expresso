name: Bootstrap npm package (temporary)

on:
  workflow_dispatch:
    inputs:
      action:
        description: Verify authentication or publish the pinned package
        required: true
        default: verify
        type: choice
        options:
          - verify
          - publish
      confirm:
        description: For publish, type the exact package identity
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: npm-bootstrap
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ae4f8921c6f574a2d119c4b2e38c88194ad57b44
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.15.0
      - name: Verify pinned release source and package identity
        run: |
          test "$(git rev-parse HEAD)" = "ae4f8921c6f574a2d119c4b2e38c88194ad57b44"
          test "$(git rev-parse 'refs/tags/v0.3.2^{commit}')" = "ae4f8921c6f574a2d119c4b2e38c88194ad57b44"
          test "$(node -p "require('./package.json').version")" = "0.3.2"
          test "$(node -p "require('./package.json').name")" = "@technodotventures/expresso"
      - run: npm ci
      - run: npm run verify

  package:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ae4f8921c6f574a2d119c4b2e38c88194ad57b44
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify clean pinned source
        run: |
          test "$(git rev-parse HEAD)" = "ae4f8921c6f574a2d119c4b2e38c88194ad57b44"
          test "$(git rev-parse 'refs/tags/v0.3.2^{commit}')" = "ae4f8921c6f574a2d119c4b2e38c88194ad57b44"
          test "$(node -p "require('./package.json').version")" = "0.3.2"
          test "$(node -p "require('./package.json').name")" = "@technodotventures/expresso"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Pack without lifecycle scripts
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-package"
          cd "$RUNNER_TEMP/npm-package"
          sha256sum technodotventures-expresso-0.3.2.tgz > technodotventures-expresso-0.3.2.tgz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: expresso-npm-0.3.2
          path: |
            ${{ runner.temp }}/npm-package/technodotventures-expresso-0.3.2.tgz
            ${{ runner.temp }}/npm-package/technodotventures-expresso-0.3.2.tgz.sha256
          if-no-files-found: error
          retention-days: 1

  authenticate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify npm authentication
        run: npm whoami --registry=https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish:
    if: ${{ inputs.action == 'publish' }}
    needs:
      - package
      - authenticate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm
    # id-token write is required because this package declares
    # publishConfig.provenance = true, and npm generates the provenance
    # attestation from the workflow OIDC token.
    #
    # This job runs NO repository code: there is no checkout, and the only
    # inputs are the pinned actions (full SHAs), a run-scoped artifact whose
    # SHA-256 is verified, and the operator's literal confirmation string.
    # The OIDC token therefore cannot be reached by repository or dependency
    # code, which was the original objection to granting this permission.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: expresso-npm-0.3.2
          path: ${{ runner.temp }}/npm-package
      - name: Verify packaged bytes and exact publication confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        working-directory: ${{ runner.temp }}/npm-package
        run: |
          sha256sum --check technodotventures-expresso-0.3.2.tgz.sha256
          tar -xOf technodotventures-expresso-0.3.2.tgz package/package.json \
            | jq -e '.name == "@technodotventures/expresso" and .version == "0.3.2"'
          test "$CONFIRM" = "@technodotventures/expresso@0.3.2"
      - name: Publish verified package artifact
        working-directory: ${{ runner.temp }}/npm-package
        run: >-
          npm publish technodotventures-expresso-0.3.2.tgz
          --ignore-scripts --access public --tag latest
          --registry=https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
