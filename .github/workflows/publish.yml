name: Publish npm package

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.15.0
      - run: npm ci
      - run: npm run verify
      - run: npm run verify:release-ref
      - name: Package agent authoring plugin
        run: >-
          git archive --format=zip
          --output expresso-agent-authoring-plugin.zip
          HEAD:plugins/expresso-agent-authoring
      - uses: actions/upload-artifact@v4
        with:
          name: expresso-agent-authoring-plugin-${{ github.ref_name }}
          path: expresso-agent-authoring-plugin.zip
          if-no-files-found: error
      - run: npm publish --access public --tag latest
